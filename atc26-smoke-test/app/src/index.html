<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATC26 Package Smoke Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b1020;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #2563eb55, transparent 35%),
          radial-gradient(circle at 80% 80%, #7c3aed44, transparent 38%),
          #0b1020;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: 40px;
        border: 1px solid #ffffff1f;
        border-radius: 24px;
        background: #11182bd9;
        box-shadow: 0 24px 80px #0008;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #93c5fd;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .status {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 28px 0 10px;
        color: #86efac;
        font-weight: 700;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 20px #22c55e;
      }

      code {
        display: block;
        padding: 18px 20px;
        overflow-wrap: anywhere;
        border: 1px solid #60a5fa44;
        border-radius: 14px;
        background: #020617aa;
        color: #bfdbfe;
        font-size: clamp(18px, 4vw, 26px);
      }

      .note {
        margin: 18px 0 0;
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">AI Training Camp 26</p>
      <h1>Package smoke test</h1>
      <p class="status"><span class="dot"></span>Marker loaded from staged package files</p>
      <code>{{ATC26_SMOKE_VERSION}}</code>
      <p class="note">
        This page was built on demand from the source tree delivered by
        <strong>atc26-smoke-test</strong>. Package sync staged the source but did
        not build or start it.
      </p>
    </main>
  </body>
</html>
