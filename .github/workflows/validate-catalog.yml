name: Validate

# Structural gates for OS packages and the rebuilding-page site:
#   validate-package-index — package registry and manifest contract
#   test-corpus-search     — workspace isolation, ingestion, retrieval, and fallback
#   build-site             — typecheck + build use-case-library-site

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the Runneth package index
        run: node --test scripts/validate-runneth-package-index.mjs

  test-corpus-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: corpus-search/requirements-test.txt
      - name: Install the pinned vector dependency
        run: python -m pip install -r corpus-search/requirements-test.txt
      - name: Test corpus-search
        run: python -m unittest discover -s corpus-search/tests -v

  build-site:
    # Typecheck + build the site so broken site code can't merge either.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: use-case-library-site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: use-case-library-site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (frontend + server)
        run: pnpm build
      - name: Test server security behavior
        run: pnpm --filter use-case-library-server test
